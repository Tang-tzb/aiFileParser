# ============================================================
# aiFileParser 应用主配置
# 说明：敏感信息采用 ${ENV:默认值} 占位符，从环境变量读取，
#       本地开发可使用默认值；生产环境务必通过环境变量注入。
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /aifp
  tomcat:
    max-swallow-size: 100MB          # 上传大文件兜底
    max-http-form-post-size: 100MB

spring:
  application:
    name: aiFileParser

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- 文件上传限制 ----------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # ---------------- 数据源 (MySQL 8.0.46) ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aifileparser}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: AiFileParserHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------- Spring AI / Qwen-Plus (DashScope) ----------------
  ai:
    dashscope:
      # 阿里云百炼平台 API Key，务必通过环境变量注入
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          # 默认模型：通义千问 Qwen-Plus
          model: qwen-plus
          # 字段抽取场景偏稳定，温度调低
          temperature: 0.3
          top-p: 0.8
      embedding:
        options:
          # DashScope 文本向量模型（1536 维）；须与 milvus.embedding-dimension 一致
          model: text-embedding-v2
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:root}
          password: ${MILVUS_PASSWORD:milvus}
        database-name: default
        collection-name: aifp_doc_chunks
        embedding-dimension: 1536
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

  # ---------------- Redis：异步任务进度快照 + Pub/Sub ----------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# ============================================================
# RAG 切片与检索参数
# ============================================================
rag:
  chunk:
    size: ${RAG_CHUNK_SIZE:800}
    overlap: ${RAG_CHUNK_OVERLAP:200}
  retrieve:
    # 每字段 Milvus 检索条数，默认 5 平衡上下文与成本
    topK: ${RAG_RETRIEVE_TOPK:5}
  extract:
    retry:
      # 抽取结果校验失败后的最大重试次数（含首次共 max-attempts+1 次 LLM 调用），默认 2
      max-attempts: ${RAG_EXTRACT_RETRY_MAX:2}

# ============================================================
# 异步任务 + SSE 进度推送参数
# ============================================================
task:
  sse:
    # SSE 连接超时（毫秒），默认 30 分钟，覆盖大文件解析全程
    timeout-ms: ${TASK_SSE_TIMEOUT_MS:1800000}
  progress:
    # 进度快照在 Redis 的存活时长（小时），任务结束自动清理
    snapshot-ttl-hours: ${TASK_PROGRESS_TTL_HOURS:3}

# ============================================================
# MyBatis-Plus 配置
# ============================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aifp.aiagent.entity
  global-config:
    banner: false
    db-config:
      # 主键策略：雪花算法 assign_id
      id-type: assign_id
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 表名下划线
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL（生产通过 profile 关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================================
# 日志（与 logback-spring.xml 配合，此处仅控制级别）
# ============================================================
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.aifp.aiagent: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: WARN

# ============================================================
# Actuator 健康检查（仅暴露必要端点）
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============================================================
# 文件存储
# ============================================================
file:
  # 上传文件根目录（相对路径基于应用工作目录；生产建议设为绝对路径）
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# ============================================================
# PDF 内容检测参数（阶段1：parser/pdf 检测层）
# ============================================================
document:
  parser:
    pdf:
      detector:
        # 整页图片判定阈值：单图有效占位比 >= 该值视为整页图（IMAGE_ONLY 依据）
        full-image-ratio: ${PDF_DETECTOR_FULL_IMAGE_RATIO:0.85}
        # 大图判定阈值：单图有效占位比 >= 该值视为大图（文字+大图 → MIXED；Logo/印章小图不影响）
        large-image-ratio: ${PDF_DETECTOR_LARGE_IMAGE_RATIO:0.20}
        # 有效文字最小字符数：非空白字符数低于该值视为无有效文字层
        text-min-count: ${PDF_DETECTOR_TEXT_MIN_COUNT:5}
      # 文字结构化参数（阶段3：parser/pdf/text 提取层）
      text:
        # Y 聚合成行的容差系数（×行内最大字高）
        line-tolerance-ratio: ${PDF_TEXT_LINE_TOLERANCE_RATIO:0.50}
        # 行内插空格的间隙系数（×字号；Helvetica 空格步进 0.278em，需小于该值方可还原空格）
        space-gap-ratio: ${PDF_TEXT_SPACE_GAP_RATIO:0.25}
        # 行间距超过该系数×前行字号则分块
        block-gap-ratio: ${PDF_TEXT_BLOCK_GAP_RATIO:1.20}
      # OCR 参数（阶段4：parser/ocr 识别层；兼容 Windows/Linux/Docker）
      ocr:
        # 识别引擎（多引擎扩展点，与条件装配联动）
        engine: ${OCR_ENGINE:tesseract}
        # 识别语言（中文简体）
        language: ${OCR_LANGUAGE:chi_sim}
        # 引擎可执行文件：默认走 PATH（裸命令名，三平台通吃）；本机安装器未写 PATH 时
        # 经环境变量覆盖，如 Windows: C:\Program Files\Tesseract-OCR\tesseract.exe
        tesseract-path: ${OCR_TESSERACT_PATH:tesseract}
        # 页面渲染 DPI（禁默认超高分辨率）
        render-dpi: ${OCR_RENDER_DPI:200}
        # 页面分割模式（3=自动布局）
        psm: ${OCR_PSM:3}
        # 单页识别超时（秒）
        timeout-seconds: ${OCR_TIMEOUT_SECONDS:300}
        # 识别并发（资源限制：2CPU/8GB → 固定 1）
        concurrency: ${OCR_CONCURRENCY:1}
