# ============================================================
# aiFileParser 应用主配置
# 说明：敏感信息采用 ${ENV:默认值} 占位符，从环境变量读取，
#       本地开发可使用默认值；生产环境务必通过环境变量注入。
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /aifp
  tomcat:
    max-swallow-size: 100MB          # 上传大文件兜底
    max-http-form-post-size: 100MB

spring:
  application:
    name: aiFileParser

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- 文件上传限制 ----------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # ---------------- 数据源 (MySQL 8.0.46) ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aifileparser}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: AiFileParserHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------- Spring AI / Qwen-Plus (DashScope) ----------------
  ai:
    dashscope:
      # 阿里云百炼平台 API Key，务必通过环境变量注入
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          # 默认模型：通义千问 Qwen-Plus
          model: qwen-plus
          # 字段抽取场景偏稳定，温度调低
          temperature: 0.3
          top-p: 0.8
      embedding:
        options:
          # DashScope 文本向量模型（1536 维）；须与 milvus.embedding-dimension 一致
          model: text-embedding-v2
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:root}
          password: ${MILVUS_PASSWORD:milvus}
        database-name: default
        collection-name: aifp_doc_chunks
        embedding-dimension: 1536
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

  # ---------------- Redis：异步任务进度快照 + Pub/Sub ----------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# ============================================================
# RAG 切片与检索参数
# ============================================================
rag:
  chunk:
    size: ${RAG_CHUNK_SIZE:800}
    overlap: ${RAG_CHUNK_OVERLAP:200}
  retrieve:
    # 每字段 Milvus 检索条数，默认 5 平衡上下文与成本
    topK: ${RAG_RETRIEVE_TOPK:5}
  extract:
    retry:
      # 抽取结果校验失败后的最大重试次数（含首次共 max-attempts+1 次 LLM 调用），默认 2
      max-attempts: ${RAG_EXTRACT_RETRY_MAX:2}

# ============================================================
# 异步任务 + SSE 进度推送参数
# ============================================================
task:
  sse:
    # SSE 连接超时（毫秒），默认 30 分钟，覆盖大文件解析全程
    timeout-ms: ${TASK_SSE_TIMEOUT_MS:1800000}
  progress:
    # 进度快照在 Redis 的存活时长（小时），任务结束自动清理
    snapshot-ttl-hours: ${TASK_PROGRESS_TTL_HOURS:3}

# ============================================================
# MyBatis-Plus 配置
# ============================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aifp.aiagent.entity
  global-config:
    banner: false
    db-config:
      # 主键策略：雪花算法 assign_id
      id-type: assign_id
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 表名下划线
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL（生产通过 profile 关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================================
# 日志（与 logback-spring.xml 配合，此处仅控制级别）
# ============================================================
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.aifp.aiagent: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: WARN

# ============================================================
# Actuator 健康检查（仅暴露必要端点）
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============================================================
# 文件存储
# ============================================================
file:
  # 上传文件根目录（相对路径基于应用工作目录；生产建议设为绝对路径）
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# ============================================================
# PDF 内容检测参数（阶段1：parser/pdf 检测层）
# ============================================================
document:
  parser:
    pdf:
      detector:
        # 整页图片判定阈值：单图有效占位比 >= 该值视为整页图（IMAGE_ONLY 依据）
        full-image-ratio: ${PDF_DETECTOR_FULL_IMAGE_RATIO:0.85}
        # 大图判定阈值：单图有效占位比 >= 该值视为大图（文字+大图 → MIXED；Logo/印章小图不影响）
        large-image-ratio: ${PDF_DETECTOR_LARGE_IMAGE_RATIO:0.20}
        # 有效文字最小字符数：非空白字符数低于该值视为无有效文字层
        text-min-count: ${PDF_DETECTOR_TEXT_MIN_COUNT:5}
      # 文字结构化参数（阶段3：parser/pdf/text 提取层）
      text:
        # Y 聚合成行的容差系数（×行内最大字高）
        line-tolerance-ratio: ${PDF_TEXT_LINE_TOLERANCE_RATIO:0.50}
        # 行内插空格的间隙系数（×字号；Helvetica 空格步进 0.278em，需小于该值方可还原空格）
        space-gap-ratio: ${PDF_TEXT_SPACE_GAP_RATIO:0.25}
        # 行内分段的间隙系数（×字号；大间隙视为跨单元格边界，段为表格值绑定原子单位）
        segment-gap-ratio: ${PDF_TEXT_SEGMENT_GAP_RATIO:2.0}
        # 行间距超过该系数×前行字号则分块
        block-gap-ratio: ${PDF_TEXT_BLOCK_GAP_RATIO:1.20}
      # OCR 参数（阶段4：parser/ocr 识别层；兼容 Windows/Linux/Docker）
      ocr:
        # 识别引擎（多引擎扩展点，与条件装配联动）
        engine: ${OCR_ENGINE:tesseract}
        # 识别语言（中文简体）
        language: ${OCR_LANGUAGE:chi_sim}
        # 引擎可执行文件：默认走 PATH（裸命令名，三平台通吃）；本机安装器未写 PATH 时
        # 经环境变量覆盖，如 Windows: C:\Program Files\Tesseract-OCR\tesseract.exe
        tesseract-path: ${OCR_TESSERACT_PATH:tesseract}
        # 页面渲染 DPI（禁默认超高分辨率）
        render-dpi: ${OCR_RENDER_DPI:200}
        # 页面分割模式（3=自动布局）
        psm: ${OCR_PSM:3}
        # 单页识别超时（秒）
        timeout-seconds: ${OCR_TIMEOUT_SECONDS:300}
        # 识别并发（资源限制：2CPU/8GB → 固定 1）
        concurrency: ${OCR_CONCURRENCY:1}
      # 视觉区域参数（阶段6：parser/pdf/region 混合融合层）
      region:
        # UNKNOWN 判定的文字覆盖率上限输入（coverage 低于该值视为"缺文字"）
        text-coverage-skip-ratio: ${PDF_REGION_TEXT_COVERAGE_SKIP_RATIO:0.50}
        # IMAGE/UNKNOWN 视觉文本候选阈值（textCandidateScore ≥ 该值才可能 OCR）
        image-text-candidate-ratio: ${PDF_REGION_IMAGE_TEXT_CANDIDATE_RATIO:0.60}
        # STAMP 判定：区域红色像素占比阈值
        stamp-red-ratio: ${PDF_REGION_STAMP_RED_RATIO:0.10}
        # OCR 词去重阈值：词面积被 PDF 原生文字覆盖的比例（非 IoU）
        word-dedup-ratio: ${PDF_REGION_WORD_DEDUP_RATIO:0.80}
        # 空间合法性容差（pt）：区域 bbox 外扩该值后需与 OCR 元素存在有效交集
        spatial-tolerance-pt: ${PDF_REGION_SPATIAL_TOLERANCE_PT:2.0}
        # 整页图豁免阈值：区域占页面积比 ≥ 该值 → 恒不区域 OCR（禁变相整页 OCR）
        full-page-forbidden-ratio: ${PDF_REGION_FULL_PAGE_FORBIDDEN_RATIO:0.85}
      # 表格结构恢复参数（阶段7：parser/pdf/layout）
      table:
        # 横线最短行程占页宽比（文字笔画不可达）
        min-h-line-ratio: ${PDF_TABLE_MIN_H_LINE_RATIO:0.15}
        # 竖线最短行程占页高比（防大号标题笔画误报）
        min-v-line-ratio: ${PDF_TABLE_MIN_V_LINE_RATIO:0.12}
        # 灰度二值阈值（覆盖浅灰色表格线，见 ImageTableRecognizer 说明）
        dark-threshold: ${PDF_TABLE_DARK_THRESHOLD:200}
        # 单元格边存在性判定：单段采样暗点占比
        edge-verify-ratio: ${PDF_TABLE_EDGE_VERIFY_RATIO:0.70}
        # 公共边分段的段长（pt，多段投票粒度）
        edge-segment-pt: ${PDF_TABLE_EDGE_SEGMENT_PT:16.0}
        # 公共边存在判定：通过段数占比（多数投票）
        edge-vote-ratio: ${PDF_TABLE_EDGE_VOTE_RATIO:0.60}
        # 共线线段合并间距（pt）
        line-merge-gap-pt: ${PDF_TABLE_LINE_MERGE_GAP_PT:3.0}
        # 格网有效性：交点存在率下限（嵌套布局制式表单会稀释整格交点率，防误判由包住率兜底）
        grid-intersection-density-min: ${PDF_TABLE_GRID_INTERSECTION_DENSITY_MIN:0.20}
        # 图像格网有效性：原生文字行包住率
        grid-text-containment-ratio: ${PDF_TABLE_GRID_TEXT_CONTAINMENT:0.60}
        # 值归属主判定：文字块被单元格覆盖面积占比
        value-coverage-ratio: ${PDF_TABLE_VALUE_COVERAGE_RATIO:0.60}
        # 中心点辅助最低覆盖率（段级兜底仅兜轻微出格；跨格合并行由段级切分+块级守卫拦截）
        center-fallback-min-coverage: ${PDF_TABLE_CENTER_FALLBACK_MIN_COVERAGE:0.50}
        # 方式二：纵排续行合并的行距因子
        coord-row-gap-factor: ${PDF_TABLE_COORD_ROW_GAP_FACTOR:1.5}
        # 表头 OCR 开关（失败自动降级 header=null）
        header-ocr-enabled: ${PDF_TABLE_HEADER_OCR_ENABLED:true}
        # 表头 OCR 置信度下限（低于视为无效表头，降级 header=null，防竖排/图形垃圾绑定）
        header-min-confidence: ${PDF_TABLE_HEADER_MIN_CONFIDENCE:0.60}
        # 表头候选：墨迹占比下限（低于视为空白格；高单元格墨量稀释，仅作廉价初筛）
        label-ink-ratio: ${PDF_TABLE_LABEL_INK_RATIO:0.005}
        # 表头候选：墨迹占比上限（高于视为图片/图形，普通 IMAGE 型数据 Cell 排除）
        header-max-ink-ratio: ${PDF_TABLE_HEADER_MAX_INK_RATIO:0.50}
        # 文字层检查主判定：原生文字段与候选格空间覆盖率阈值（有文字层的格不进表头 OCR，
        # §十"OCR 只对缺少文字层的视觉区域补充"；center-in-cell 为 0.50 常量辅助）
        header-native-text-coverage: ${PDF_TABLE_HEADER_NATIVE_TEXT_COVERAGE:0.60}
      # 结构识别参数（阶段9：parser/pdf/structure AST 组装层）
      structure:
        # 标题判定倍数：主字号 ≥ 页内 PDF_TEXT 中位字号×该值 且 ≤50 字符视为标题
        title-font-ratio: ${PDF_STRUCTURE_TITLE_FONT_RATIO:1.2}
      # 结构清洗参数（阶段10：parser/pdf/clean，清洗发生在 DocumentAst 层）
      clean:
        line-join:
          # 段模式"标题样"下一行守卫：下一行长度 ≤ 该值且无句末标点 → 保留换行
          title-like-max-length: ${PDF_CLEAN_TITLE_LIKE_MAX:20}
        header-footer:
          # 跨页重复判定最小页数（不足则不做页眉页脚判定）
          min-pages: ${PDF_CLEAN_HF_MIN_PAGES:2}
          # 顶部带位比例：距页顶距离 ÷ 页高 ≤ 该值视为页顶带
          top-band-ratio: ${PDF_CLEAN_HF_TOP_BAND:0.12}
          # 底部带位比例：距页底距离（bbox.y）÷ 页高 ≤ 该值视为页底带
          bottom-band-ratio: ${PDF_CLEAN_HF_BOTTOM_BAND:0.12}
        ocr-digit-fix:
          # OCR 数字纠错总开关（仅作用于 source=OCR 的文本，PDF_TEXT/FUSION value 永不触碰）
          enabled: ${PDF_CLEAN_OCR_FIX:true}
      # Markdown 渲染参数（阶段 11：parser/pdf/markdown，DocumentAst 纯投影）
      markdown:
        # 键值清单渲染开关：开启时每页 nodes 后追加“字段：值”（关闭则严格遵循阶段 9 契约）
        key-values-enabled: ${PDF_MARKDOWN_KEY_VALUES:true}
